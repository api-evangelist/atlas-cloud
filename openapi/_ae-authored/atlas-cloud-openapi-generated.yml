        kty:
          type: string
          description: Key type (OKP for Ed25519)
        crv:
          type: string
          description: Curve (Ed25519)
        x:
          type: string
          description: base64url-encoded Ed25519 public key
        use:
          type: string
          description: Key usage (sig)
        alg:
          type: string
          description: Algorithm (EdDSA)
        kid:
          type: string
          description: Key ID for signature header correlation
    GetBalanceResponse:
      type: object
      properties:
        value:
          type: string
        currency:
          type: string
    PostChatCompletionsRequest:
      type: object
      properties:
        model:
          type: string
          description: Model identifier (e.g., deepseek-v3, qwen-turbo)
        messages:
          type: array
          description: Conversation messages with role and content
        temperature:
          type: number
          description: Controls randomness (0.0 - 2.0, default varies by model)
        max_tokens:
          type: number
          description: Maximum tokens in the response
        stream:
          type: boolean
          description: Enable streaming output
        top_p:
          type: number
          description: Nucleus sampling parameter
      required:
      - model
      - messages
    PostChatCompletionsResponse:
      type: object
      properties:
        choices:
          type: array
          description: Array of completion choices
        message:
          type: object
          description: The message object containing role and content
